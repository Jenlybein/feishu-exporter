<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>飞书批量导出助手</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">飞书批量导出助手</div>
      <div class="sub">仅支持飞书文档页面</div>
    </header>

    <section class="mode-panel">
      <select id="export-mode" class="format-select" aria-label="导出方式">
        <option value="single">单篇导出（当前文档）</option>
        <option value="batch">批量导出（勾选目录）</option>
      </select>
    </section>

    <section class="tree-panel" id="tree-panel" hidden>
      <div class="tree-head">
        <span class="tree-title">目录树</span>
        <button id="scan-tree" class="ghost-button" type="button">刷新目录</button>
      </div>
      <div class="tree-hint" id="tree-hint">
        只含页面上已展开的部分，折叠节点的子节点未加载，需要在飞书页面上手动展开这些节点后，再点一次「刷新目录」。
      </div>
      <div class="tree-toolbar" id="tree-toolbar" hidden>
        <label class="tree-check-all">
          <input type="checkbox" id="tree-check-all" />
          <span>全选</span>
        </label>
        <span class="tree-count" id="tree-count">已选 0 / 0</span>
      </div>
      <div class="tree-list" id="tree-list" hidden></div>
    </section>

    <section class="export-panel">
      <select id="export-format" class="format-select" aria-label="导出格式">
        <option value="markdown">导出为 Markdown</option>
        <option value="word">导出为 Word</option>
        <option value="pdf">导出为 PDF</option>
        <option value="html">导出为 HTML</option>
        <option value="attachments">导出附件</option>
      </select>
      <div class="format-hint" id="format-hint"></div>
    </section>

    <button id="run-export" class="run-button">执行</button>

    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="status" class="status">准备就绪，等待操作…</div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
